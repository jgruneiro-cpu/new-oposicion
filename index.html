<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MisOpos · Bibliotecas del Estado</title>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        --color-background-primary: #FFFFFF;
        --color-background-secondary: #FAFAF7;
        --color-background-tertiary: #F4F3EE;
        --color-text-primary: #1A1A1A;
        --color-text-secondary: #4B4B4B;
        --color-text-tertiary: #8A8A85;
        --color-border-tertiary: #E5E5E0;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
      }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--color-background-tertiary);
        color: var(--color-text-primary);
        -webkit-font-smoothing: antialiased;
      }
      button, input {
        font-family: inherit;
        outline: none;
      }
      button {
        border: 1px solid var(--color-border-tertiary);
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        border-radius: var(--border-radius-md);
        cursor: pointer;
        transition: all .12s ease;
      }
      button:hover:not(:disabled) { background: var(--color-background-secondary); }
      button:disabled { opacity: .4; cursor: default; }
      input {
        border: 1px solid var(--color-border-tertiary);
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        border-radius: var(--border-radius-md);
        padding: 7px 10px;
      }
      input:focus { border-color: #0F6E56; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
