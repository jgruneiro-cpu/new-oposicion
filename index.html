<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MisOpos · Bibliotecas del Estado</title>

    <!-- Tipografía Poppins de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        /* Tipografía */
        --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;

        /* Paleta Acttiv */
        --color-bg: #FFFFFF;
        --color-bg-soft: #FAFAFA;
        --color-bg-hover: #F5F5F5;
        --color-text: #1A1A1A;
        --color-text-soft: #4B4B4B;
        --color-text-mute: #8A8A85;
        --color-border: #E8E8E8;
        --color-border-soft: #F0F0F0;

        /* Naranja Acttiv (resaltados) */
        --color-accent: #F26522;
        --color-accent-soft: #FEF0E7;
        --color-accent-border: #FBCFB2;
        --color-accent-hover: #D9541A;

        /* Estados */
        --color-success: #0F6E56;
        --color-success-soft: #E1F5EE;
        --color-danger: #B91C1C;
        --color-danger-soft: #FEE2E2;
        --color-warning: #854F0B;
        --color-warning-soft: #FFF8E5;

        /* Radios */
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
      }

      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        font-weight: 400;
        background: var(--color-bg);
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button, input, textarea {
        font-family: inherit;
        outline: none;
      }
      button {
        border: 1px solid var(--color-border);
        background: var(--color-bg);
        color: var(--color-text);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all .15s ease;
        font-weight: 500;
      }
      button:hover:not(:disabled) {
        background: var(--color-bg-hover);
      }
      button:disabled { opacity: .4; cursor: default; }
      input {
        border: 1px solid var(--color-border);
        background: var(--color-bg);
        color: var(--color-text);
        border-radius: var(--radius-md);
        padding: 8px 12px;
        font-weight: 400;
      }
      input:focus { border-color: var(--color-accent); }

      /* Scrollbar sutil */
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: #DDDDD8;
        border-radius: 4px;
      }
      *::-webkit-scrollbar-thumb:hover { background: #C0C0BA; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
